<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quên mật khẩu | VietTrucks</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#0f5132,#16a34a);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  color:#1f2937;
}

.card{
  width:100%;
  max-width:520px;
  background:#fff;
  border-radius:18px;
  padding:34px;
  box-shadow:0 20px 60px rgba(0,0,0,.20);
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:800;
  color:#16a34a;
  margin-bottom:20px;
}

h1{
  font-size:26px;
  text-align:center;
  margin-bottom:10px;
}

.desc{
  text-align:center;
  color:#6b7280;
  line-height:1.6;
  font-size:14px;
  margin-bottom:24px;
}


/* =========================
   TAB
========================= */

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  background:#f3f4f6;
  padding:5px;
  border-radius:12px;
  margin-bottom:24px;
}

.tab{
  border:0;
  background:transparent;
  color:#4b5563;
  padding:12px 8px;
  border-radius:9px;
  font-weight:700;
  cursor:pointer;
}

.tab.active{
  background:#16a34a;
  color:#fff;
}


/* =========================
   FORM
========================= */

.panel{
  display:none;
}

.panel.active{
  display:block;
}

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

input{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:13px 14px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#16a34a;
  box-shadow:0 0 0 3px rgba(22,163,74,.10);
}

.main-btn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:14px;
  background:#16a34a;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.main-btn:hover{
  background:#15803d;
}

.main-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}


/* =========================
   OTP
========================= */

.otp-area{
  display:none;
  margin-top:20px;
  padding-top:20px;
  border-top:1px solid #e5e7eb;
}

.password-area{
  display:none;
  margin-top:20px;
  padding-top:20px;
  border-top:1px solid #e5e7eb;
}


/* =========================
   MESSAGE
========================= */

.message{
  display:none;
  margin-top:18px;
  padding:13px;
  border-radius:10px;
  font-size:13px;
  line-height:1.6;
}

.message.success{
  display:block;
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  color:#166534;
}

.message.error{
  display:block;
  background:#fef2f2;
  border:1px solid #fecaca;
  color:#991b1b;
}

.notice{
  margin-top:20px;
  background:#fff7ed;
  border:1px solid #fed7aa;
  color:#9a3412;
  border-radius:10px;
  padding:13px;
  font-size:12px;
  line-height:1.6;
}

.back{
  text-align:center;
  margin-top:22px;
}

.back a{
  color:#16a34a;
  text-decoration:none;
  font-weight:700;
  font-size:14px;
}

.small{
  font-size:12px;
  color:#6b7280;
  line-height:1.5;
  margin-top:7px;
}

@media(max-width:520px){
  .card{
    padding:25px 20px;
  }
}
</style>
</head>


<body>

<div class="card">

  <div class="logo">
    🚚 VietTrucks
  </div>

  <h1>Quên mật khẩu</h1>

  <p class="desc">
    Chọn cách xác minh tài khoản để tạo mật khẩu mới.
  </p>


  <!-- =========================================
       TAB
  ========================================== -->

  <div class="tabs">

    <button
      type="button"
      id="emailTab"
      class="tab active"
      onclick="switchTab('email')"
    >
      📧 Email
    </button>

    <button
      type="button"
      id="phoneTab"
      class="tab"
      onclick="switchTab('phone')"
    >
      📱 Số điện thoại
    </button>

  </div>


  <!-- =========================================
       EMAIL
  ========================================== -->

  <div
    id="emailPanel"
    class="panel active"
  >

    <form
      id="emailForm"
      onsubmit="sendEmailReset(event)"
    >

      <div class="form-group">

        <label>
          Email đã đăng ký
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="VD: admin@viettrucks.com"
          required
        >

      </div>

      <button
        id="emailBtn"
        type="submit"
        class="main-btn"
      >
        Gửi liên kết đặt lại mật khẩu
      </button>

    </form>

    <div
      id="emailMessage"
      class="message"
    ></div>

    <div class="notice">
      Sau khi nhận email, hãy bấm liên kết đặt lại mật khẩu.
      VietTrucks sẽ mở trang tạo mật khẩu mới.
    </div>

  </div>


  <!-- =========================================
       PHONE
  ========================================== -->

  <div
    id="phonePanel"
    class="panel"
  >

    <!-- BƯỚC 1 -->

    <form
      id="phoneForm"
      onsubmit="sendPhoneOtp(event)"
    >

      <div class="form-group">

        <label>
          Số điện thoại đã đăng ký
        </label>

        <input
          id="phone"
          type="tel"
          inputmode="tel"
          autocomplete="tel"
          placeholder="VD: 0388134999"
          required
        >

        <div class="small">
          Mã OTP sẽ được gửi đến số điện thoại đã đăng ký.
        </div>

      </div>

      <button
        id="sendOtpBtn"
        type="submit"
        class="main-btn"
      >
        Gửi mã OTP
      </button>

    </form>


    <!-- BƯỚC 2 -->

    <div
      id="otpArea"
      class="otp-area"
    >

      <div class="form-group">

        <label>
          Mã OTP
        </label>

        <input
          id="otp"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="8"
          placeholder="Nhập mã OTP"
        >

      </div>

      <button
        id="verifyOtpBtn"
        type="button"
        class="main-btn"
        onclick="verifyPhoneOtp()"
      >
        Xác minh OTP
      </button>

    </div>


    <!-- BƯỚC 3 -->

    <div
      id="phonePasswordArea"
      class="password-area"
    >

      <div class="form-group">

        <label>
          Mật khẩu mới
        </label>

        <input
          id="phonePassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          placeholder="Tối thiểu 8 ký tự"
        >

      </div>


      <div class="form-group">

        <label>
          Nhập lại mật khẩu mới
        </label>

        <input
          id="phonePassword2"
          type="password"
          autocomplete="new-password"
          minlength="8"
          placeholder="Nhập lại mật khẩu"
        >

      </div>


      <button
        id="phonePasswordBtn"
        type="button"
        class="main-btn"
        onclick="resetPhonePassword()"
      >
        Cập nhật mật khẩu
      </button>

    </div>


    <div
      id="phoneMessage"
      class="message"
    ></div>

  </div>


  <div class="back">

    <a href="dang-nhap.html">
      ← Quay lại đăng nhập
    </a>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>


<script>

const supabaseClient =
  window.supabaseClient;


/* =========================================================
   EDGE FUNCTION URL
========================================================= */



const SEND_OTP_FUNCTION =
  "twilio-send-otp";

const VERIFY_OTP_FUNCTION =
  "twilio-verify-otp";

const RESET_PHONE_PASSWORD_FUNCTION =
  "reset-phone-password";


/* =========================================================
   TAB
========================================================= */

function switchTab(type){

  const emailTab =
    document.getElementById("emailTab");

  const phoneTab =
    document.getElementById("phoneTab");

  const emailPanel =
    document.getElementById("emailPanel");

  const phonePanel =
    document.getElementById("phonePanel");


  if(type === "phone"){

    emailTab.classList.remove("active");
    phoneTab.classList.add("active");

    emailPanel.classList.remove("active");
    phonePanel.classList.add("active");

  }
  else{

    phoneTab.classList.remove("active");
    emailTab.classList.add("active");

    phonePanel.classList.remove("active");
    emailPanel.classList.add("active");

  }

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  elementId,
  type,
  message
){

  const box =
    document.getElementById(
      elementId
    );

  box.className =
    "message " + type;

  box.textContent =
    message;

}


function clearMessage(elementId){

  const box =
    document.getElementById(
      elementId
    );

  box.className =
    "message";

  box.textContent =
    "";

}


/* =========================================================
   PHONE NORMALIZE
========================================================= */

function normalizeVietnamPhone(value){

  let phone =
    String(value || "")
      .trim()
      .replace(/[^\d+]/g,"");


  if(phone.startsWith("0")){

    phone =
      "+84" +
      phone.slice(1);

  }
  else if(
    phone.startsWith("84") &&
    !phone.startsWith("+84")
  ){

    phone =
      "+" + phone;

  }


  return phone;
}


/* =========================================================
   EMAIL RESET
========================================================= */

async function sendEmailReset(event){

  event.preventDefault();

  clearMessage(
    "emailMessage"
  );


  const email =
    document
      .getElementById("email")
      .value
      .trim()
      .toLowerCase();


  const button =
    document.getElementById(
      "emailBtn"
    );


  if(!email){

    showMessage(
      "emailMessage",
      "error",
      "Vui lòng nhập email."
    );

    return;
  }


  button.disabled =
    true;

  button.textContent =
    "Đang gửi...";


  try{

    const {
      error
    } =
    await supabaseClient.auth
      .resetPasswordForEmail(
        email,
        {
          redirectTo:
            "https://viettrucks.com/doi-mat-khau.html"
        }
      );


    if(error){

      console.error(error);


      if(
        error.message
          ?.toLowerCase()
          .includes(
            "email rate limit"
          )
      ){

        throw new Error(
          "Hệ thống đang giới hạn số lần gửi email. Vui lòng chờ một lúc rồi thử lại."
        );
      }


      throw error;
    }


    showMessage(
      "emailMessage",
      "success",
      "Đã gửi liên kết đặt lại mật khẩu. Vui lòng kiểm tra hộp thư đến và thư rác."
    );

  }
  catch(error){

    showMessage(
      "emailMessage",
      "error",
      error.message ||
      "Không thể gửi email đặt lại mật khẩu."
    );

  }
  finally{

    button.disabled =
      false;

    button.textContent =
      "Gửi liên kết đặt lại mật khẩu";

  }

}


/* =========================================================
   GỌI EDGE FUNCTION
========================================================= */

async function callFunction(
  functionName,
  body
){

  /*
    Dùng supabase.functions.invoke để không cần
    tự ghép URL hoặc đưa API key vào code.
  */

  const {
    data,
    error
  } =
  await supabaseClient.functions.invoke(
    functionName,
    {
      body:body
    }
  );


  if(error){

    console.error(
      functionName,
      error
    );

    throw new Error(
      error.message ||
      "Không gọi được máy chủ."
    );
  }


  if(
    data &&
    data.success === false
  ){

    throw new Error(
      data.error ||
      data.message ||
      "Yêu cầu không thành công."
    );
  }


  return data;

}


/* =========================================================
   PHONE STEP 1
   SEND OTP
========================================================= */

async function sendPhoneOtp(event){

  event.preventDefault();

  clearMessage(
    "phoneMessage"
  );


  const rawPhone =
    document
      .getElementById("phone")
      .value;


  const phone =
    normalizeVietnamPhone(
      rawPhone
    );


  if(
    !phone.startsWith("+84") ||
    phone.length < 11
  ){

    showMessage(
      "phoneMessage",
      "error",
      "Số điện thoại không hợp lệ. Ví dụ: 0388134999"
    );

    return;
  }


  const button =
    document.getElementById(
      "sendOtpBtn"
    );


  button.disabled =
    true;

  button.textContent =
    "Đang gửi OTP...";


  try{

    /*
      Function hiện có của VietTrucks.
    */

    await callFunction(
      SEND_OTP_FUNCTION,
      {
        phone:phone,

        purpose:
          "password_reset"
      }
    );


    document
      .getElementById(
        "otpArea"
      )
      .style.display =
      "block";


    showMessage(
      "phoneMessage",
      "success",
      "Mã OTP đã được gửi. Vui lòng kiểm tra điện thoại."
    );

  }
  catch(error){

    showMessage(
      "phoneMessage",
      "error",
      error.message ||
      "Không gửi được OTP."
    );

  }
  finally{

    button.disabled =
      false;

    button.textContent =
      "Gửi mã OTP";

  }

}


/* =========================================================
   PHONE STEP 2
   VERIFY OTP
========================================================= */

let phoneResetToken =
  null;


async function verifyPhoneOtp(){

  clearMessage(
    "phoneMessage"
  );


  const phone =
    normalizeVietnamPhone(
      document
        .getElementById("phone")
        .value
    );


  const otp =
    document
      .getElementById("otp")
      .value
      .trim();


  if(!otp){

    showMessage(
      "phoneMessage",
      "error",
      "Vui lòng nhập mã OTP."
    );

    return;
  }


  const button =
    document.getElementById(
      "verifyOtpBtn"
    );


  button.disabled =
    true;

  button.textContent =
    "Đang xác minh...";


  try{

    const data =
      await callFunction(
        VERIFY_OTP_FUNCTION,
        {
          phone:phone,
          code:otp,
          purpose:
            "password_reset"
        }
      );


    /*
      Function reset mật khẩu sẽ cần token
      do server cấp sau khi OTP hợp lệ.

      Không dùng mỗi biến JS "OTP hợp lệ"
      làm quyền đổi mật khẩu.
    */

    phoneResetToken =
      data?.reset_token ||
      data?.resetToken ||
      null;


    if(!phoneResetToken){

      throw new Error(
        "OTP hợp lệ nhưng máy chủ chưa cấp mã đặt lại mật khẩu. Cần triển khai reset-phone-password."
      );
    }


    document
      .getElementById(
        "phonePasswordArea"
      )
      .style.display =
      "block";


    showMessage(
      "phoneMessage",
      "success",
      "Xác minh số điện thoại thành công. Hãy tạo mật khẩu mới."
    );

  }
  catch(error){

    showMessage(
      "phoneMessage",
      "error",
      error.message ||
      "Mã OTP không hợp lệ."
    );

  }
  finally{

    button.disabled =
      false;

    button.textContent =
      "Xác minh OTP";

  }

}


/* =========================================================
   PHONE STEP 3
   RESET PASSWORD
========================================================= */

async function resetPhonePassword(){

  clearMessage(
    "phoneMessage"
  );


  if(!phoneResetToken){

    showMessage(
      "phoneMessage",
      "error",
      "Phiên xác minh OTP không hợp lệ. Vui lòng xác minh lại số điện thoại."
    );

    return;
  }


  const password =
    document
      .getElementById(
        "phonePassword"
      )
      .value;


  const password2 =
    document
      .getElementById(
        "phonePassword2"
      )
      .value;


  if(password.length < 8){

    showMessage(
      "phoneMessage",
      "error",
      "Mật khẩu mới phải có ít nhất 8 ký tự."
    );

    return;
  }


  if(password !== password2){

    showMessage(
      "phoneMessage",
      "error",
      "Hai mật khẩu không giống nhau."
    );

    return;
  }


  const phone =
    normalizeVietnamPhone(
      document
        .getElementById("phone")
        .value
    );


  const button =
    document.getElementById(
      "phonePasswordBtn"
    );


  button.disabled =
    true;

  button.textContent =
    "Đang cập nhật...";


  try{

    await callFunction(
      RESET_PHONE_PASSWORD_FUNCTION,
      {
        phone:phone,

        reset_token:
          phoneResetToken,

        password:
          password
      }
    );


    showMessage(
      "phoneMessage",
      "success",
      "Đổi mật khẩu thành công. Đang chuyển về trang đăng nhập..."
    );


    phoneResetToken =
      null;


    setTimeout(
      function(){

        window.location.href =
          "dang-nhap.html";

      },
      1500
    );

  }
  catch(error){

    showMessage(
      "phoneMessage",
      "error",
      error.message ||
      "Không thể cập nhật mật khẩu."
    );

  }
  finally{

    button.disabled =
      false;

    button.textContent =
      "Cập nhật mật khẩu";

  }

}

</script>

</body>
</html>
