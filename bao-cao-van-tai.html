<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo cáo vận tải | VietTruck</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#f5f7fa;
      color:#1f2937;
    }

    .header{
      background:#fff;
      border-bottom:1px solid #e5e7eb;
      padding:16px 28px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
      z-index:10;
    }

    .logo{
      font-size:24px;
      font-weight:700;
      color:#16a34a;
      text-decoration:none;
    }

    .header-links{
      display:flex;
      gap:16px;
      align-items:center;
    }

    .back{
      color:#4b5563;
      text-decoration:none;
      font-size:14px;
    }

    .container{
      max-width:1220px;
      margin:30px auto;
      padding:0 20px;
    }

    .title-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      margin-bottom:22px;
    }

    .title h1{
      font-size:28px;
      margin-bottom:8px;
    }

    .title p{
      color:#6b7280;
    }

    .period{
      background:#fff;
      border:1px solid #d1d5db;
      border-radius:8px;
      padding:10px 12px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
      margin-bottom:22px;
    }

    .stat{
      background:#fff;
      border-radius:12px;
      padding:20px;
      box-shadow:0 2px 10px rgba(0,0,0,.05);
    }

    .stat small{
      color:#6b7280;
    }

    .stat strong{
      display:block;
      font-size:26px;
      margin-top:8px;
    }

    .positive{
      color:#16a34a;
      font-size:13px;
      margin-top:6px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
      margin-bottom:20px;
    }

    .panel{
      background:#fff;
      border-radius:12px;
      padding:20px;
      box-shadow:0 2px 10px rgba(0,0,0,.05);
    }

    .panel h2{
      font-size:18px;
      margin-bottom:18px;
    }

    .bar-row{
      margin-bottom:16px;
    }

    .bar-top{
      display:flex;
      justify-content:space-between;
      gap:12px;
      margin-bottom:7px;
      font-size:14px;
    }

    .bar{
      height:10px;
      background:#eef2f7;
      border-radius:20px;
      overflow:hidden;
    }

    .fill{
      height:100%;
      background:#16a34a;
      border-radius:20px;
    }

    .w96{width:96%}
    .w91{width:91%}
    .w87{width:87%}
    .w82{width:82%}
    .w78{width:78%}
    .w73{width:73%}

    .table-wrap{
      background:#fff;
      border-radius:12px;
      overflow:auto;
      box-shadow:0 2px 10px rgba(0,0,0,.05);
      margin-bottom:20px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:950px;
    }

    th{
      text-align:left;
      background:#f8fafc;
      padding:14px 16px;
      color:#4b5563;
      font-size:13px;
      border-bottom:1px solid #e5e7eb;
    }

    td{
      padding:15px 16px;
      border-bottom:1px solid #eef2f7;
      font-size:14px;
    }

    tr:hover{
      background:#fafafa;
    }

    .rank{
      font-weight:bold;
      color:#16a34a;
    }

    .status{
      display:inline-block;
      padding:5px 9px;
      border-radius:20px;
      font-size:11px;
      font-weight:bold;
    }

    .good{
      background:#dcfce7;
      color:#15803d;
    }

    .warning{
      background:#fef3c7;
      color:#b45309;
    }

    .bottom-grid{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:18px;
    }

    .metric{
      padding:14px 0;
      border-bottom:1px solid #eef2f7;
      display:flex;
      justify-content:space-between;
      gap:12px;
      font-size:14px;
    }

    .metric:last-child{
      border-bottom:none;
    }

    .metric span{
      color:#6b7280;
    }

    @media(max-width:900px){
      .stats{
        grid-template-columns:repeat(2,1fr);
      }

      .grid{
        grid-template-columns:1fr;
      }

      .bottom-grid{
        grid-template-columns:1fr;
      }
    }

    @media(max-width:520px){
      .stats{
        grid-template-columns:1fr;
      }

      .title-row{
        flex-direction:column;
        align-items:flex-start;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <a href="index.html" class="logo">🚚 VietTruck</a>

  <div class="header-links">
  <a href="chi-phi-van-tai.html" class="back">Chi phí vận tải</a>
  <a href="dieu-phoi-van-tai.html" class="back">Điều phối vận tải</a>
  <a href="dashboard.html" class="back">Dashboard</a>
</div>
</header>

<div class="container">

  <div class="title-row">
    <div class="title">
      <h1>Báo cáo vận tải & KPI</h1>
      <p>Tổng hợp hiệu quả vận hành, doanh thu, phương tiện và tài xế.</p>
    </div>

    <select class="period">
      <option>Tháng 09/2026</option>
      <option>Tháng 08/2026</option>
      <option>Quý III/2026</option>
      <option>Năm 2026</option>
    </select>
  </div>

  

  <div class="grid">

    

    
  </div>

  <div class="table-wrap">

    <table>
      <thead>
        <tr>
          <th>Xếp hạng</th>
          <th>Tuyến vận tải</th>
          <th>Số chuyến</th>
          <th>Doanh thu</th>
          <th>Quãng đường</th>
          <th>Đúng giờ</th>
          <th>Hiệu quả</th>
        </tr>
      </thead>

      <tbody>

        
      </tbody>
    </table>

  </div>

  

</body>
</html>
