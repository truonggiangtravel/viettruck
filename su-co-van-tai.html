<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sự cố vận tải | VietTruck</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#f5f7fa;
      color:#1f2937;
    }

    .header{
      background:#fff;
      border-bottom:1px solid #e5e7eb;
      padding:16px 28px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
      z-index:10;
    }

    .logo{
      font-size:24px;
      font-weight:700;
      color:#16a34a;
      text-decoration:none;
    }

    .header-links{
      display:flex;
      gap:16px;
      align-items:center;
    }

    .header-links a{
      color:#4b5563;
      text-decoration:none;
      font-size:14px;
    }

    .container{
      max-width:1220px;
      margin:30px auto;
      padding:0 20px;
    }

    .title-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      margin-bottom:22px;
    }

    .title h1{
      font-size:28px;
      margin-bottom:7px;
    }

    .title p{
      color:#6b7280;
    }

    .add-btn{
      background:#16a34a;
      color:#fff;
      border:none;
      padding:11px 16px;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
      margin-bottom:22px;
    }

    .stat{
      background:#fff;
      border-radius:12px;
      padding:20px;
      box-shadow:0 2px 10px rgba(0,0,0,.05);
    }

    .stat small{
      color:#6b7280;
    }

    .stat strong{
      display:block;
      font-size:27px;
      margin-top:8px;
    }

    .filters{
      background:#fff;
      border-radius:12px;
      padding:18px;
      display:grid;
      grid-template-columns:2fr 1fr 1fr 1fr auto;
      gap:12px;
      margin-bottom:20px;
      box-shadow:0 2px 10px rgba(0,0,0,.05);
    }

    input,select{
      width:100%;
      border:1px solid #d1d5db;
      border-radius:8px;
      padding:11px 12px;
      outline:none;
    }

    .search-btn{
      border:none;
      background:#16a34a;
      color:#fff;
      border-radius:8px;
      padding:0 18px;
      font-weight:bold;
      cursor:pointer;
    }

    .table-wrap{
      background:#fff;
      border-radius:12px;
      overflow:auto;
      box-shadow:0 2px 10px rgba(0,0,0,.05);
      margin-bottom:22px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:1050px;
    }

    th{
      background:#f8fafc;
      padding:14px 16px;
      text-align:left;
      font-size:13px;
      color:#4b5563;
      border-bottom:1px solid #e5e7eb;
    }

    td{
      padding:15px 16px;
      font-size:14px;
      border-bottom:1px solid #eef2f7;
      vertical-align:top;
    }

    tr:hover{
      background:#fafafa;
    }

    .status{
      display:inline-block;
      padding:5px 9px;
      border-radius:20px;
      font-size:11px;
      font-weight:bold;
      white-space:nowrap;
    }

    .urgent{
      background:#fee2e2;
      color:#b91c1c;
    }

    .processing{
      background:#fef3c7;
      color:#b45309;
    }

    .done{
      background:#dcfce7;
      color:#15803d;
    }

    .new{
      background:#dbeafe;
      color:#1d4ed8;
    }

    .action{
      color:#16a34a;
      text-decoration:none;
      font-weight:bold;
      font-size:13px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    .panel{
      background:#fff;
      border-radius:12px;
      padding:20px;
      box-shadow:0 2px 10px rgba(0,0,0,.05);
    }

    .panel h2{
      font-size:18px;
      margin-bottom:15px;
    }

    .row{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:11px 0;
      border-bottom:1px solid #eef2f7;
      font-size:14px;
    }

    .row:last-child{
      border-bottom:none;
    }

    .row span{
      color:#6b7280;
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      z-index:100;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .modal-box{
      width:100%;
      max-width:620px;
      background:#fff;
      border-radius:14px;
      padding:24px;
    }

    .modal-box h2{
      margin-bottom:18px;
    }

    .form-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .form-group{
      margin-bottom:12px;
    }

    .form-group label{
      display:block;
      font-size:13px;
      margin-bottom:6px;
      font-weight:bold;
    }

    textarea{
      width:100%;
      min-height:90px;
      border:1px solid #d1d5db;
      border-radius:8px;
      padding:11px;
      resize:vertical;
    }

    .modal-actions{
      display:flex;
      justify-content:flex-end;
      gap:10px;
      margin-top:18px;
    }

    .cancel{
      border:1px solid #d1d5db;
      background:#fff;
      padding:10px 16px;
      border-radius:8px;
      cursor:pointer;
    }

    .save{
      border:none;
      background:#16a34a;
      color:#fff;
      padding:10px 16px;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
    }

    @media(max-width:900px){
      .stats{
        grid-template-columns:repeat(2,1fr);
      }

      .filters{
        grid-template-columns:1fr 1fr;
      }

      .grid{
        grid-template-columns:1fr;
      }
    }

    @media(max-width:560px){
      .stats,
      .filters,
      .form-grid{
        grid-template-columns:1fr;
      }

      .title-row{
        flex-direction:column;
        align-items:flex-start;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <a href="index.html" class="logo">🚚 VietTruck</a>

  <div class="header-links">
    <a href="canh-bao-van-tai.html">Cảnh báo</a>
    <a href="dieu-phoi-van-tai.html">Điều phối</a>
    <a href="dashboard.html">Dashboard</a>
  </div>
</header>

<div class="container">

  <div class="title-row">

    <div class="title">
      <h1>Quản lý sự cố vận tải</h1>
      <p>Ghi nhận, theo dõi và xử lý các sự cố phát sinh trong quá trình vận chuyển.</p>
    </div>

    <button class="add-btn" onclick="openModal()">
      + Báo cáo sự cố
    </button>

  </div>

 

  <div class="filters">

    <input type="text" placeholder="Tìm mã sự cố, biển số, tài xế">

    <select>
      <option>Tất cả loại sự cố</option>
      <option>Xe hỏng</option>
      <option>Tai nạn</option>
      <option>Giao hàng chậm</option>
      <option>Hư hỏng hàng hóa</option>
      <option>Mất hàng</option>
      <option>Khách hàng khiếu nại</option>
    </select>

    <select>
      <option>Tất cả mức độ</option>
      <option>Khẩn cấp</option>
      <option>Cao</option>
      <option>Trung bình</option>
      <option>Thấp</option>
    </select>

    <select>
      <option>Tất cả trạng thái</option>
      <option>Mới</option>
      <option>Đang xử lý</option>
      <option>Đã xử lý</option>
    </select>

    <button class="search-btn">Tìm kiếm</button>

  </div>

  <div class="table-wrap">

    <table>

      <thead>
        <tr>
          <th>Mã sự cố</th>
          <th>Thời gian</th>
          <th>Loại sự cố</th>
          <th>Xe / Tài xế</th>
          <th>Chuyến hàng</th>
          <th>Địa điểm</th>
          <th>Mức độ</th>
          <th>Trạng thái</th>
          <th>Xử lý</th>
        </tr>
      </thead>

      <tbody>

        

      </tbody>

    </table>

  </div>

  

</div>

<div class="modal" id="incidentModal">

  <div class="modal-box">

    <h2>Báo cáo sự cố mới</h2>

    <div class="form-grid">

      <div class="form-group">
        <label>Loại sự cố</label>
        <select>
          <option>Xe hỏng</option>
          <option>Tai nạn</option>
          <option>Giao hàng chậm</option>
          <option>Hư hỏng hàng hóa</option>
          <option>Mất hàng</option>
          <option>Khách hàng khiếu nại</option>
          <option>Khác</option>
        </select>
      </div>

      <div class="form-group">
        <label>Mức độ</label>
        <select>
          <option>Khẩn cấp</option>
          <option>Cao</option>
          <option>Trung bình</option>
          <option>Thấp</option>
        </select>
      </div>

      <div class="form-group">
        <label>Biển số xe</label>
        <input type="text" placeholder="VD: 99H-456.78">
      </div>

      <div class="form-group">
        <label>Mã chuyến</label>
        <input type="text" placeholder="VD: DH-090526-007">
      </div>

    </div>

    <div class="form-group">
      <label>Địa điểm xảy ra sự cố</label>
      <input type="text" placeholder="Nhập địa điểm">
    </div>

    <div class="form-group">
      <label>Mô tả sự cố</label>
      <textarea placeholder="Mô tả chi tiết tình trạng sự cố..."></textarea>
    </div>

    <div class="modal-actions">

      <button class="cancel" onclick="closeModal()">
        Hủy
      </button>

      <button class="save" onclick="saveIncident()">
        Gửi báo cáo
      </button>

    </div>

  </div>

</div>

<script>

  function openModal(){
    document.getElementById("incidentModal").style.display="flex";
  }

  function closeModal(){
    document.getElementById("incidentModal").style.display="none";
  }

  function saveIncident(){
    alert("Đã ghi nhận báo cáo sự cố.");
    closeModal();
  }

</script>

</body>
</html>
