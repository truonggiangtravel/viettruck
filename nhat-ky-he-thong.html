<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhật ký hệ thống | VietTruck</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}
body{
  background:#f5f7fa;
  color:#1f2937;
}
.header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:16px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  font-size:24px;
  font-weight:700;
  color:#16a34a;
  text-decoration:none;
}
.header-links{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
}
.header-links a{
  color:#4b5563;
  text-decoration:none;
  font-size:14px;
}
.container{
  max-width:1220px;
  margin:30px auto;
  padding:0 20px;
}
.title-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin-bottom:22px;
}
.title h1{
  font-size:28px;
  margin-bottom:8px;
}
.title p{
  color:#6b7280;
}
.export-btn{
  background:#16a34a;
  color:white;
  border:0;
  border-radius:8px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:22px;
}
.stat{
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}
.stat small{
  color:#6b7280;
}
.stat strong{
  display:block;
  font-size:27px;
  margin-top:8px;
}
.green{color:#16a34a}
.blue{color:#2563eb}
.orange{color:#d97706}
.red{color:#dc2626}

.filters{
  background:#fff;
  padding:18px;
  border-radius:12px;
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr auto;
  gap:12px;
  margin-bottom:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}
input,select{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:8px;
  padding:11px;
}
.search-btn{
  border:0;
  background:#16a34a;
  color:#fff;
  border-radius:8px;
  padding:0 18px;
  font-weight:bold;
  cursor:pointer;
}
.table-wrap{
  background:#fff;
  border-radius:12px;
  overflow:auto;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
  margin-bottom:22px;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:1200px;
}
th{
  background:#f8fafc;
  padding:14px 16px;
  text-align:left;
  font-size:13px;
  color:#4b5563;
  border-bottom:1px solid #e5e7eb;
}
td{
  padding:15px 16px;
  border-bottom:1px solid #eef2f7;
  font-size:14px;
  vertical-align:top;
}
.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}
.login{background:#dbeafe;color:#1d4ed8}
.create{background:#dcfce7;color:#15803d}
.update{background:#fef3c7;color:#b45309}
.delete{background:#fee2e2;color:#b91c1c}
.approve{background:#ede9fe;color:#6d28d9}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}
.success{background:#dcfce7;color:#15803d}
.failed{background:#fee2e2;color:#b91c1c}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}
.panel{
  background:#fff;
  border-radius:12px;
  padding:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}
.panel h2{
  font-size:18px;
  margin-bottom:16px;
}
.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:11px 0;
  border-bottom:1px solid #eef2f7;
  font-size:14px;
}
.row span{
  color:#6b7280;
}
.notice{
  margin-top:20px;
  background:#fff7ed;
  border:1px solid #fed7aa;
  color:#9a3412;
  padding:14px;
  border-radius:10px;
  font-size:14px;
  line-height:1.6;
}
@media(max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .filters{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:1fr}
}
@media(max-width:560px){
  .stats,.filters{grid-template-columns:1fr}
  .title-row{flex-direction:column;align-items:flex-start}
}
</style>
</head>

<body>

<header class="header">

  <a href="index.html" class="logo">🚚 VietTruck</a>

  <div class="header-links">
    <a href="quan-ly-nhan-su.html">Nhân sự</a>
    <a href="phan-quyen-he-thong.html">Phân quyền</a>
    <a href="dashboard.html">Dashboard</a>
  </div>

</header>

<div class="container">

  <div class="title-row">

    <div class="title">
      <h1>Nhật ký hoạt động hệ thống</h1>
      <p>Theo dõi thao tác của tài khoản VietTruck để kiểm soát bảo mật và truy vết thay đổi dữ liệu.</p>
    </div>

    <button class="export-btn" onclick="exportLog()">
      📥 Xuất nhật ký
    </button>

  </div>

  

  <div class="filters">

    <input type="text" placeholder="Tìm người dùng, IP, nội dung thao tác">

    <select>
      <option>Tất cả hành động</option>
      <option>Đăng nhập</option>
      <option>Tạo mới</option>
      <option>Cập nhật</option>
      <option>Xóa</option>
      <option>Duyệt</option>
    </select>

    <select>
      <option>Tất cả module</option>
      <option>Đơn hàng</option>
      <option>Điều phối</option>
      <option>Khách hàng</option>
      <option>Hợp đồng</option>
      <option>Công nợ</option>
      <option>Nhân sự</option>
      <option>Phân quyền</option>
    </select>

    <select>
      <option>Hôm nay</option>
      <option>7 ngày gần nhất</option>
      <option>30 ngày gần nhất</option>
      <option>Tháng này</option>
    </select>

    <button class="search-btn">Tìm kiếm</button>

  </div>

  <div class="table-wrap">

    <table>

      <thead>
        <tr>
          <th>Thời gian</th>
          <th>Người dùng</th>
          <th>Vai trò</th>
          <th>Hành động</th>
          <th>Module</th>
          <th>Nội dung</th>
          <th>IP</th>
          <th>Thiết bị</th>
          <th>Trạng thái</th>
        </tr>
      </thead>

      <tbody>

        

      </tbody>

    </table>

  </div>

  

  

</div>

<script>
function exportLog(){
  alert("Chức năng xuất nhật ký sẽ hoạt động khi VietTruck được kết nối backend và cơ sở dữ liệu.");
}
</script>

</body>
</html>
