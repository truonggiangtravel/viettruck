<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đổi mật khẩu | VietTruck</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#f5f7fa;
  color:#1f2937;
}

.header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:16px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#16a34a;
  font-size:24px;
  font-weight:800;
  text-decoration:none;
}

.header-links{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
}

.header-links a{
  color:#4b5563;
  text-decoration:none;
  font-size:14px;
}

.container{
  max-width:560px;
  margin:60px auto;
  padding:0 20px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:32px;
  box-shadow:0 5px 25px rgba(0,0,0,.07);
}

.icon{
  width:64px;
  height:64px;
  margin:0 auto 18px;
  border-radius:50%;
  background:#dcfce7;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

h1{
  text-align:center;
  font-size:27px;
  margin-bottom:9px;
}

.desc{
  text-align:center;
  color:#6b7280;
  font-size:14px;
  line-height:1.6;
  margin-bottom:28px;
}

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.password-box{
  position:relative;
}

input{
  width:100%;
  padding:13px 45px 13px 14px;
  border:1px solid #d1d5db;
  border-radius:9px;
  outline:none;
  font-size:14px;
}

input:focus{
  border-color:#16a34a;
  box-shadow:0 0 0 3px rgba(22,163,74,.1);
}

.eye{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  user-select:none;
}

.rules{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:15px;
  margin-bottom:20px;
}

.rules strong{
  display:block;
  margin-bottom:9px;
  font-size:13px;
}

.rules p{
  font-size:12px;
  color:#6b7280;
  line-height:1.8;
}

.save-btn{
  width:100%;
  border:0;
  border-radius:9px;
  padding:14px;
  background:#16a34a;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.save-btn:hover{
  background:#15803d;
}

.save-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.back{
  text-align:center;
  margin-top:20px;
}

.back a{
  color:#16a34a;
  text-decoration:none;
  font-size:14px;
  font-weight:700;
}

.message{
  display:none;
  padding:14px;
  border-radius:10px;
  margin-top:18px;
  font-size:13px;
  line-height:1.6;
}

.success{
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  color:#166534;
}

.error{
  background:#fef2f2;
  border:1px solid #fecaca;
  color:#991b1b;
}

.info{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  color:#1e40af;
}

.reset-link{
  display:inline-block;
  margin-top:8px;
  color:#15803d;
  font-weight:700;
  text-decoration:none;
}

.hidden{
  display:none !important;
}

@media(max-width:600px){
  .header{
    padding:15px 18px;
  }

  .header-links{
    gap:10px;
  }

  .container{
    margin:30px auto;
  }

  .card{
    padding:24px;
  }
}
</style>
</head>

<body>

<header class="header">

  <a href="index.html" class="logo">
    🚚 VietTruck
  </a>

  <div class="header-links">
    <a href="quan-ly-tai-khoan.html">Tài khoản</a>
    <a href="cai-dat-he-thong.html">Cài đặt</a>
    <a href="dashboard.html">Dashboard</a>
  </div>

</header>


<div class="container">

  <div class="card">

    <div class="icon">🔐</div>

    <h1 id="pageTitle">Đổi mật khẩu</h1>

    <p class="desc" id="pageDesc">
      Tạo mật khẩu mới cho tài khoản VietTruck.
    </p>


    <form id="passwordForm">

      <div class="form-group" id="currentPasswordGroup">

        <label>Mật khẩu hiện tại</label>

        <div class="password-box">

          <input
            id="currentPassword"
            type="password"
            autocomplete="current-password"
            placeholder="Nhập mật khẩu hiện tại"
          >

          <span
            class="eye"
            onclick="togglePassword('currentPassword')">
            👁
          </span>

        </div>

      </div>


      <div class="form-group">

        <label>Mật khẩu mới</label>

        <div class="password-box">

          <input
            id="newPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Nhập mật khẩu mới"
            minlength="8"
            required
          >

          <span
            class="eye"
            onclick="togglePassword('newPassword')">
            👁
          </span>

        </div>

      </div>


      <div class="form-group">

        <label>Nhập lại mật khẩu mới</label>

        <div class="password-box">

          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Nhập lại mật khẩu mới"
            minlength="8"
            required
          >

          <span
            class="eye"
            onclick="togglePassword('confirmPassword')">
            👁
          </span>

        </div>

      </div>


      <div class="rules">

        <strong>Yêu cầu mật khẩu</strong>

        <p>
          ✓ Tối thiểu 8 ký tự<br>
          ✓ Có chữ hoa và chữ thường<br>
          ✓ Có ít nhất một chữ số<br>
          ✓ Nên có ký tự đặc biệt<br>
          ✓ Không sử dụng lại mật khẩu cũ
        </p>

      </div>


      <button
        type="submit"
        class="save-btn"
        id="saveBtn">
        Đổi mật khẩu
      </button>

    </form>


    <div
      class="message success"
      id="successBox">
    </div>

    <div
      class="message error"
      id="errorBox">
    </div>

    <div
      class="message info"
      id="infoBox">
    </div>


    <div class="back">

      <a href="dang-nhap.html">
        ← Quay lại đăng nhập
      </a>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://ksyakrcgqzsupqyusyo.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_OLGPIepJQ0FBoEoL7jvySA_9GC5hSgD";


const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


let recoveryMode = false;


/* =========================
   HIỆN / ẨN MẬT KHẨU
========================= */

function togglePassword(id){

  const input =
    document.getElementById(id);

  if(!input) return;

  input.type =
    input.type === "password"
      ? "text"
      : "password";
}


/* =========================
   HIỂN THỊ THÔNG BÁO
========================= */

function hideMessages(){

  document.getElementById("successBox").style.display =
    "none";

  document.getElementById("errorBox").style.display =
    "none";

  document.getElementById("infoBox").style.display =
    "none";
}


function showError(message){

  hideMessages();

  const box =
    document.getElementById("errorBox");

  box.innerHTML = message;

  box.style.display = "block";
}


function showSuccess(message){

  hideMessages();

  const box =
    document.getElementById("successBox");

  box.innerHTML = message;

  box.style.display = "block";
}


function showInfo(message){

  hideMessages();

  const box =
    document.getElementById("infoBox");

  box.innerHTML = message;

  box.style.display = "block";
}


/* =========================
   KIỂM TRA MẬT KHẨU
========================= */

function validatePassword(password){

  if(password.length < 8){

    return "Mật khẩu phải có ít nhất 8 ký tự.";

  }

  if(!/[a-z]/.test(password)){

    return "Mật khẩu cần có ít nhất một chữ thường.";

  }

  if(!/[A-Z]/.test(password)){

    return "Mật khẩu cần có ít nhất một chữ hoa.";

  }

  if(!/[0-9]/.test(password)){

    return "Mật khẩu cần có ít nhất một chữ số.";

  }

  return null;
}


/* =========================
   KIỂM TRA LINK RECOVERY
========================= */

async function initializePage(){

  const params =
    new URLSearchParams(window.location.search);

  const hashParams =
    new URLSearchParams(
      window.location.hash.substring(1)
    );


  const errorCode =
    params.get("error_code");

  const errorDescription =
    params.get("error_description");


  /* LINK HẾT HẠN */

  if(
    errorCode === "otp_expired" ||
    params.get("error") === "access_denied"
  ){

    recoveryMode = true;

    document
      .getElementById("currentPasswordGroup")
      .classList.add("hidden");

    document
      .getElementById("passwordForm")
      .classList.add("hidden");

    document.getElementById("pageTitle").textContent =
      "Liên kết đã hết hạn";

    document.getElementById("pageDesc").textContent =
      "Liên kết đặt lại mật khẩu không còn hiệu lực.";

    showError(
      "❌ Link đặt lại mật khẩu đã hết hạn hoặc đã được sử dụng." +
      "<br><br>" +
      "Vui lòng yêu cầu một email đặt lại mật khẩu mới." +
      "<br>" +
      '<a class="reset-link" href="quen-mat-khau.html">' +
      "Gửi lại yêu cầu đặt mật khẩu →" +
      "</a>"
    );

    return;
  }


  /* SUPABASE PKCE */

  const code =
    params.get("code");

  if(code){

    recoveryMode = true;

    document
      .getElementById("currentPasswordGroup")
      .classList.add("hidden");

    try{

      const {
        data,
        error
      } =
      await supabaseClient.auth
        .exchangeCodeForSession(code);


      if(error){

        console.error(
          "exchangeCodeForSession:",
          error
        );

        showError(
          "❌ Link đặt lại mật khẩu không hợp lệ hoặc đã hết hạn." +
          "<br><br>" +
          '<a class="reset-link" href="quen-mat-khau.html">' +
          "Yêu cầu link mới →" +
          "</a>"
        );

        document
          .getElementById("passwordForm")
          .classList.add("hidden");

        return;
      }


      if(data?.session){

        showInfo(
          "✓ Link xác thực hợp lệ. " +
          "Vui lòng nhập mật khẩu mới."
        );

      }

    }
    catch(err){

      console.error(err);

    }

  }


  /* SUPABASE IMPLICIT FLOW */

  const accessToken =
    hashParams.get("access_token");

  const refreshToken =
    hashParams.get("refresh_token");

  const type =
    hashParams.get("type");


  if(
    accessToken &&
    refreshToken
  ){

    if(type === "recovery"){

      recoveryMode = true;

    }

    document
      .getElementById("currentPasswordGroup")
      .classList.add("hidden");


    const {
      error
    } =
    await supabaseClient.auth.setSession({

      access_token:
        accessToken,

      refresh_token:
        refreshToken

    });


    if(error){

      console.error(
        "setSession:",
        error
      );

      showError(
        "❌ Không thể xác thực link đặt lại mật khẩu."
      );

      return;

    }


    showInfo(
      "✓ Link xác thực hợp lệ. " +
      "Vui lòng nhập mật khẩu mới."
    );

  }


  /* LẮNG NGHE PASSWORD RECOVERY */

  supabaseClient.auth.onAuthStateChange(
    (event, session) => {

      console.log(
        "Auth event:",
        event
      );

      if(event === "PASSWORD_RECOVERY"){

        recoveryMode = true;

        document
          .getElementById("currentPasswordGroup")
          .classList.add("hidden");

        showInfo(
          "✓ Xác thực thành công. " +
          "Hãy nhập mật khẩu mới."
        );

      }

    }
  );


  /* KIỂM TRA SESSION */

  const {
    data: {
      session
    }
  } =
  await supabaseClient.auth.getSession();


  if(!session){

    /*
      Nếu không có session
      và cũng không phải recovery link
    */

    if(
      !code &&
      !accessToken
    ){

      showError(
        "❌ Phiên đăng nhập hoặc link đặt lại mật khẩu không hợp lệ." +
        "<br><br>" +
        '<a class="reset-link" href="quen-mat-khau.html">' +
        "Quên mật khẩu? Gửi yêu cầu mới →" +
        "</a>"
      );

      document
        .getElementById("passwordForm")
        .classList.add("hidden");

    }

    return;

  }


  /*
    Nếu đang đăng nhập bình thường:
    yêu cầu mật khẩu hiện tại
  */

  if(!recoveryMode){

    document
      .getElementById("currentPasswordGroup")
      .classList.remove("hidden");

  }

}


/* =========================
   ĐỔI MẬT KHẨU THẬT
========================= */

async function changePassword(event){

  event.preventDefault();

  hideMessages();


  const currentPassword =
    document
      .getElementById("currentPassword")
      .value;

  const newPassword =
    document
      .getElementById("newPassword")
      .value;

  const confirmPassword =
    document
      .getElementById("confirmPassword")
      .value;


  const saveBtn =
    document.getElementById("saveBtn");


  /* KIỂM TRA */

  const validation =
    validatePassword(newPassword);


  if(validation){

    showError(
      "❌ " + validation
    );

    return;

  }


  if(
    newPassword !==
    confirmPassword
  ){

    showError(
      "❌ Hai mật khẩu mới không trùng khớp."
    );

    return;

  }


  if(
    !recoveryMode &&
    !currentPassword
  ){

    showError(
      "❌ Vui lòng nhập mật khẩu hiện tại."
    );

    return;

  }


  if(
    currentPassword &&
    currentPassword ===
    newPassword
  ){

    showError(
      "❌ Mật khẩu mới không được giống mật khẩu hiện tại."
    );

    return;

  }


  saveBtn.disabled = true;

  saveBtn.textContent =
    "Đang xử lý...";


  try{


    const {
      data: {
        session
      }
    } =
    await supabaseClient.auth.getSession();


    if(!session){

      showError(
        "❌ Phiên xác thực đã hết hạn." +
        "<br><br>" +
        '<a class="reset-link" href="quen-mat-khau.html">' +
        "Yêu cầu link mới →" +
        "</a>"
      );

      return;

    }


    /*
      ĐỔI MẬT KHẨU KHI
      ĐANG ĐĂNG NHẬP

      Xác minh mật khẩu hiện tại
      bằng signInWithPassword.
    */

    if(!recoveryMode){

      const email =
        session.user.email;


      if(!email){

        showError(
          "❌ Không tìm thấy email của tài khoản."
        );

        return;

      }


      const {
        error:
        verifyError
      } =
      await supabaseClient.auth
        .signInWithPassword({

          email:
            email,

          password:
            currentPassword

        });


      if(verifyError){

        console.error(
          verifyError
        );

        showError(
          "❌ Mật khẩu hiện tại không chính xác."
        );

        return;

      }

    }


    /*
      CẬP NHẬT MẬT KHẨU
      THẬT TRÊN SUPABASE AUTH
    */

    const {
      data,
      error
    } =
    await supabaseClient.auth
      .updateUser({

        password:
          newPassword

      });


    if(error){

      console.error(
        "updateUser:",
        error
      );

      showError(
        "❌ Không thể đổi mật khẩu: " +
        error.message
      );

      return;

    }


    console.log(
      "Password updated:",
      data
    );


    showSuccess(
      "✅ Đổi mật khẩu thành công." +
      "<br>Bạn sẽ được chuyển về trang đăng nhập."
    );


    /*
      ĐĂNG XUẤT SESSION CŨ
    */

    await supabaseClient.auth.signOut();


    setTimeout(
      function(){

        window.location.href =
          "dang-nhap.html";

      },
      1800
    );


  }
  catch(error){

    console.error(
      error
    );

    showError(
      "❌ Có lỗi xảy ra. Vui lòng thử lại."
    );

  }
  finally{

    saveBtn.disabled =
      false;

    saveBtn.textContent =
      "Đổi mật khẩu";

  }

}


/* =========================
   FORM
========================= */

document
  .getElementById("passwordForm")
  .addEventListener(
    "submit",
    changePassword
  );


/* =========================
   KHỞI TẠO
========================= */

initializePage();

</script>

</body>
</html>
