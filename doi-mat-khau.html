<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đặt lại mật khẩu | VietTrucks</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#0f5132,#16a34a);
  color:#1f2937;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.card{
  width:100%;
  max-width:520px;
  background:#fff;
  border-radius:18px;
  padding:34px;
  box-shadow:0 20px 60px rgba(0,0,0,.20);
}

.logo{
  text-align:center;
  color:#16a34a;
  font-size:28px;
  font-weight:800;
  margin-bottom:20px;
}

.icon{
  width:66px;
  height:66px;
  border-radius:50%;
  background:#dcfce7;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 18px;
  font-size:30px;
}

h1{
  text-align:center;
  font-size:26px;
  margin-bottom:10px;
}

.desc{
  text-align:center;
  color:#6b7280;
  font-size:14px;
  line-height:1.6;
  margin-bottom:25px;
}

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.password-box{
  position:relative;
}

input{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:13px 46px 13px 14px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#16a34a;
  box-shadow:0 0 0 3px rgba(22,163,74,.10);
}

.eye{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  user-select:none;
}

.rules{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:15px;
  margin-bottom:20px;
}

.rules strong{
  display:block;
  font-size:13px;
  margin-bottom:8px;
}

.rules p{
  font-size:12px;
  color:#6b7280;
  line-height:1.8;
}

.save-btn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:14px;
  background:#16a34a;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.save-btn:hover{
  background:#15803d;
}

.save-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:18px;
  padding:14px;
  border-radius:10px;
  font-size:13px;
  line-height:1.6;
}

.message.success{
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  color:#166534;
}

.message.error{
  background:#fef2f2;
  border:1px solid #fecaca;
  color:#991b1b;
}

.message.info{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  color:#1e40af;
}

.back{
  text-align:center;
  margin-top:22px;
}

.back a{
  color:#16a34a;
  text-decoration:none;
  font-weight:700;
  font-size:14px;
}

.reset-link{
  display:inline-block;
  margin-top:8px;
  color:#15803d;
  font-weight:700;
  text-decoration:none;
}

.hidden{
  display:none !important;
}

.loading{
  text-align:center;
  padding:18px 0;
  color:#6b7280;
  font-size:14px;
}

@media(max-width:520px){
  .card{
    padding:26px 20px;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    🚚 VietTrucks
  </div>

  <div class="icon">
    🔐
  </div>

  <h1 id="pageTitle">
    Tạo mật khẩu mới
  </h1>

  <p class="desc" id="pageDesc">
    Đang kiểm tra liên kết đặt lại mật khẩu...
  </p>


  <!-- LOADING -->
  <div id="loadingBox" class="loading">
    Đang xác thực...
  </div>


  <!-- FORM -->
  <form id="passwordForm" class="hidden">

    <div class="form-group">

      <label>
        Mật khẩu mới
      </label>

      <div class="password-box">

        <input
          id="newPassword"
          type="password"
          autocomplete="new-password"
          placeholder="Nhập mật khẩu mới"
          minlength="8"
          required
        >

        <span
          class="eye"
          onclick="togglePassword('newPassword')"
        >
          👁
        </span>

      </div>

    </div>


    <div class="form-group">

      <label>
        Nhập lại mật khẩu mới
      </label>

      <div class="password-box">

        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          placeholder="Nhập lại mật khẩu mới"
          minlength="8"
          required
        >

        <span
          class="eye"
          onclick="togglePassword('confirmPassword')"
        >
          👁
        </span>

      </div>

    </div>


    <div class="rules">

      <strong>
        Yêu cầu mật khẩu
      </strong>

      <p>
        ✓ Tối thiểu 8 ký tự<br>
        ✓ Có ít nhất một chữ thường<br>
        ✓ Có ít nhất một chữ hoa<br>
        ✓ Có ít nhất một chữ số<br>
        ✓ Nên có thêm ký tự đặc biệt
      </p>

    </div>


    <button
      id="saveBtn"
      type="submit"
      class="save-btn"
    >
      Cập nhật mật khẩu
    </button>

  </form>


  <div
    id="infoBox"
    class="message info"
  ></div>

  <div
    id="successBox"
    class="message success"
  ></div>

  <div
    id="errorBox"
    class="message error"
  ></div>


  <div class="back">

    <a href="dang-nhap.html">
      ← Quay lại đăng nhập
    </a>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const supabaseClient = window.supabaseClient;

if (!supabaseClient) {
  alert("Không khởi tạo được Supabase.");
  throw new Error("supabaseClient not found");
}


/* =========================================================
   ELEMENTS
========================================================= */

const passwordForm =
  document.getElementById("passwordForm");

const newPasswordInput =
  document.getElementById("newPassword");

const confirmPasswordInput =
  document.getElementById("confirmPassword");

const saveBtn =
  document.getElementById("saveBtn");

const loadingBox =
  document.getElementById("loadingBox");

const pageTitle =
  document.getElementById("pageTitle");

const pageDesc =
  document.getElementById("pageDesc");

const infoBox =
  document.getElementById("infoBox");

const successBox =
  document.getElementById("successBox");

const errorBox =
  document.getElementById("errorBox");


let recoveryReady = false;


/* =========================================================
   HIỆN / ẨN PASSWORD
========================================================= */

function togglePassword(id){

  const input =
    document.getElementById(id);

  if(!input) return;

  input.type =
    input.type === "password"
      ? "text"
      : "password";
}


/* =========================================================
   MESSAGE
========================================================= */

function hideMessages(){

  infoBox.style.display =
    "none";

  successBox.style.display =
    "none";

  errorBox.style.display =
    "none";

}


function showInfo(message){

  hideMessages();

  infoBox.innerHTML =
    message;

  infoBox.style.display =
    "block";

}


function showSuccess(message){

  hideMessages();

  successBox.innerHTML =
    message;

  successBox.style.display =
    "block";

}


function showError(message){

  hideMessages();

  errorBox.innerHTML =
    message;

  errorBox.style.display =
    "block";

}


/* =========================================================
   PASSWORD VALIDATION
========================================================= */

function validatePassword(password){

  if(password.length < 8){

    return "Mật khẩu phải có ít nhất 8 ký tự.";

  }

  if(!/[a-z]/.test(password)){

    return "Mật khẩu phải có ít nhất một chữ thường.";

  }

  if(!/[A-Z]/.test(password)){

    return "Mật khẩu phải có ít nhất một chữ hoa.";

  }

  if(!/[0-9]/.test(password)){

    return "Mật khẩu phải có ít nhất một chữ số.";

  }

  return null;

}


/* =========================================================
   HIỆN FORM RESET
========================================================= */

function enableRecoveryForm(){

  if(recoveryReady){
    return;
  }

  recoveryReady = true;

  loadingBox.classList.add(
    "hidden"
  );

  passwordForm.classList.remove(
    "hidden"
  );

  pageTitle.textContent =
    "Tạo mật khẩu mới";

  pageDesc.textContent =
    "Liên kết đã được xác thực. Hãy nhập mật khẩu mới cho tài khoản VietTrucks.";

  showInfo(
    "✓ Xác thực thành công. Bạn có thể tạo mật khẩu mới."
  );

}


/* =========================================================
   LINK KHÔNG HỢP LỆ
========================================================= */

function showInvalidLink(message){

  recoveryReady = false;

  loadingBox.classList.add(
    "hidden"
  );

  passwordForm.classList.add(
    "hidden"
  );

  pageTitle.textContent =
    "Liên kết không hợp lệ";

  pageDesc.textContent =
    "Không thể xác thực yêu cầu đặt lại mật khẩu.";

  showError(
    "❌ " +
    message +
    "<br><br>" +
    '<a class="reset-link" href="quen-mat-khau.html">' +
    "Gửi yêu cầu đặt lại mật khẩu mới →" +
    "</a>"
  );

}


/* =========================================================
   XỬ LÝ RECOVERY LINK
========================================================= */

async function initializeRecovery(){

  hideMessages();

  const url =
    new URL(window.location.href);

  const params =
    url.searchParams;

  const hashParams =
    new URLSearchParams(
      window.location.hash.substring(1)
    );


  /*
    ========================================================
    1. KIỂM TRA ERROR TRONG URL
    ========================================================
  */

  const urlError =
    params.get("error") ||
    hashParams.get("error");

  const errorCode =
    params.get("error_code") ||
    hashParams.get("error_code");

  const errorDescription =
    params.get("error_description") ||
    hashParams.get("error_description");


  if(urlError || errorCode){

    console.error(
      "Recovery URL error:",
      {
        urlError,
        errorCode,
        errorDescription
      }
    );

    showInvalidLink(
      decodeURIComponent(
        errorDescription ||
        "Liên kết đã hết hạn hoặc đã được sử dụng."
      )
    );

    return;
  }


  /*
    ========================================================
    2. PKCE FLOW
       URL dạng:
       doi-mat-khau.html?code=...
    ========================================================
  */

  const code =
    params.get("code");


  if(code){

    console.log(
      "Recovery PKCE code detected"
    );

    try{

      const {
        data,
        error
      } =
      await supabaseClient.auth
        .exchangeCodeForSession(
          code
        );


      if(error){

        console.error(
          "exchangeCodeForSession:",
          error
        );

        /*
          Có trường hợp Supabase client đã tự xử lý
          code trước khi đoạn JS này chạy.

          Vì vậy kiểm tra session một lần nữa
          trước khi kết luận link hỏng.
        */

        const {
          data: sessionCheck
        } =
        await supabaseClient.auth
          .getSession();


        if(
          sessionCheck?.session?.user
        ){

          enableRecoveryForm();

          cleanRecoveryUrl();

          return;
        }


        showInvalidLink(
          "Liên kết đặt lại mật khẩu đã hết hạn hoặc đã được sử dụng."
        );

        return;

      }


      if(
        data?.session?.user
      ){

        enableRecoveryForm();

        cleanRecoveryUrl();

        return;
      }

    }
    catch(error){

      console.error(
        "PKCE recovery error:",
        error
      );

    }

  }


  /*
    ========================================================
    3. IMPLICIT FLOW
       URL dạng:
       #access_token=...
       &refresh_token=...
       &type=recovery
    ========================================================
  */

  const accessToken =
    hashParams.get(
      "access_token"
    );

  const refreshToken =
    hashParams.get(
      "refresh_token"
    );

  const type =
    hashParams.get(
      "type"
    );


  if(
    accessToken &&
    refreshToken
  ){

    console.log(
      "Recovery implicit tokens detected"
    );


    try{

      const {
        data,
        error
      } =
      await supabaseClient.auth
        .setSession({

          access_token:
            accessToken,

          refresh_token:
            refreshToken

        });


      if(error){

        console.error(
          "setSession:",
          error
        );

        showInvalidLink(
          "Không thể xác thực phiên đặt lại mật khẩu."
        );

        return;

      }


      if(
        data?.session?.user
      ){

        enableRecoveryForm();

        cleanRecoveryUrl();

        return;

      }

    }
    catch(error){

      console.error(
        "Implicit recovery error:",
        error
      );

    }

  }


  /*
    ========================================================
    4. KIỂM TRA SESSION ĐÃ ĐƯỢC SUPABASE TỰ TẠO
    ========================================================
  */

  try{

    const {
      data,
      error
    } =
    await supabaseClient.auth
      .getSession();


    if(error){

      console.error(
        "getSession:",
        error
      );

    }


    if(
      data?.session?.user
    ){

      console.log(
        "Existing authenticated recovery session found"
      );

      enableRecoveryForm();

      cleanRecoveryUrl();

      return;

    }

  }
  catch(error){

    console.error(
      "Session check error:",
      error
    );

  }


  /*
    ========================================================
    5. CHỜ EVENT PASSWORD_RECOVERY
       Supabase đôi khi phát event sau khi trang load.
    ========================================================
  */

  showInfo(
    "Đang xác thực liên kết đặt lại mật khẩu..."
  );


  let resolved =
    false;


  const {
    data: listener
  } =
  supabaseClient.auth
    .onAuthStateChange(
      (event, session) => {

        console.log(
          "Auth event:",
          event
        );


        if(
          event === "PASSWORD_RECOVERY" &&
          session?.user
        ){

          resolved =
            true;

          enableRecoveryForm();

          cleanRecoveryUrl();

        }

      }
    );


  /*
    Chờ tối đa 2 giây cho Supabase xử lý recovery.
  */

  setTimeout(
    async function(){

      if(recoveryReady || resolved){
        return;
      }


      try{

        const {
          data
        } =
        await supabaseClient.auth
          .getSession();


        if(
          data?.session?.user
        ){

          enableRecoveryForm();

          cleanRecoveryUrl();

          return;

        }

      }
      catch(error){

        console.error(
          error
        );

      }


      showInvalidLink(
        "Phiên đặt lại mật khẩu không tồn tại hoặc đã hết hạn."
      );


      try{

        listener?.subscription
          ?.unsubscribe();

      }
      catch(e){}

    },
    2000
  );

}


/* =========================================================
   XÓA TOKEN/CODE KHỎI THANH ĐỊA CHỈ
========================================================= */

function cleanRecoveryUrl(){

  try{

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

  }
  catch(error){

    console.warn(
      "Không thể làm sạch URL:",
      error
    );

  }

}


/* =========================================================
   CẬP NHẬT MẬT KHẨU
========================================================= */

passwordForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    hideMessages();


    if(!recoveryReady){

      showError(
        "❌ Phiên đặt lại mật khẩu chưa được xác thực."
      );

      return;

    }


    const newPassword =
      newPasswordInput.value;

    const confirmPassword =
      confirmPasswordInput.value;


    /*
      VALIDATE PASSWORD
    */

    const validation =
      validatePassword(
        newPassword
      );


    if(validation){

      showError(
        "❌ " +
        validation
      );

      return;

    }


    if(
      newPassword !==
      confirmPassword
    ){

      showError(
        "❌ Hai mật khẩu mới không trùng khớp."
      );

      return;

    }


    saveBtn.disabled =
      true;

    saveBtn.textContent =
      "Đang cập nhật...";


    try{

      /*
        KIỂM TRA SESSION TRƯỚC KHI UPDATE
      */

      const {
        data: sessionData,
        error: sessionError
      } =
      await supabaseClient.auth
        .getSession();


      if(sessionError){

        throw sessionError;

      }


      if(
        !sessionData?.session?.user
      ){

        throw new Error(
          "Phiên xác thực đã hết hạn. Vui lòng yêu cầu link đặt lại mật khẩu mới."
        );

      }


      /*
        UPDATE PASSWORD THẬT
      */

      const {
        data,
        error
      } =
      await supabaseClient.auth
        .updateUser({

          password:
            newPassword

        });


      if(error){

        console.error(
          "updateUser:",
          error
        );

        throw error;

      }


      console.log(
        "Password updated successfully:",
        data?.user?.id
      );


      /*
        KHÓA FORM
      */

      newPasswordInput.disabled =
        true;

      confirmPasswordInput.disabled =
        true;

      saveBtn.disabled =
        true;


      showSuccess(
        "✅ Mật khẩu đã được cập nhật thành công." +
        "<br><br>" +
        "Đang chuyển về trang đăng nhập..."
      );


      /*
        ĐĂNG XUẤT RECOVERY SESSION
      */

      try{

        await supabaseClient.auth
          .signOut();

      }
      catch(error){

        console.warn(
          "signOut:",
          error
        );

      }


      /*
        VỀ ĐĂNG NHẬP
      */

      setTimeout(
        function(){

          window.location.replace(
            "dang-nhap.html"
          );

        },
        1800
      );

    }
    catch(error){

      console.error(
        "Password reset error:",
        error
      );


      showError(
        "❌ Không thể cập nhật mật khẩu: " +
        (
          error?.message ||
          "Có lỗi không xác định."
        ) +
        "<br><br>" +
        '<a class="reset-link" href="quen-mat-khau.html">' +
        "Gửi yêu cầu đặt lại mật khẩu mới →" +
        "</a>"
      );


      saveBtn.disabled =
        false;

      saveBtn.textContent =
        "Cập nhật mật khẩu";

    }

  }
);


/* =========================================================
   KHỞI ĐỘNG
========================================================= */

initializeRecovery();

</script>

</body>
</html>
