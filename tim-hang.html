<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;

}

body{
    font-family:"Be Vietnam Pro",sans-serif;

}

a{

}

.container-page{
    max-width:1180px;
    margin:auto;

}

/* =========================
   HEADER
========================= */

.search-header{
    background:#fff;
    border-bottom:1px solid #e5e9e7;
    position:sticky;
    top:0;
    z-index:999;
}

.search-nav{
    min-height:76px;
    display:flex;

    justify-content:space-between;
    gap:25px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    color:#087b40;
    position:relative;
    z-index:1001;
}

.logo-icon{
    font-size:34px;
}

.logo strong{
    font-size:25px;
}

.logo small{
    display:block;
    font-size:11px;
    color:#65736c;
}

.menu{
    display:flex;
    align-items:center;
    gap:22px;
}

.menu a{

    font-weight:600;

}

.menu a:hover,
.menu a.active{

}

/* =========================
   NÚT ĐĂNG NHẬP
========================= */

.nav-buttons{
    display:flex;
    align-items:center;
    gap:10px;
    position:relative;
    z-index:99999 !important;
    pointer-events:auto !important;
}

.nav-buttons button,

}

.btn-outline{
    color:#078c4b;
    background:#ffffff;
    border:1px solid #078c4b;
}

.btn-green{
    color:#ffffff;
    background:#078c4b;
    border:1px solid #078c4b;
}

.nav-buttons button:hover,
.nav-buttons a:hover{
    opacity:.88;
}

/* =========================
   TIÊU ĐỀ
========================= */

.page-head{
    background:linear-gradient(135deg,#087d45,#0aa45a);
    color:#fff;
    padding:36px 0;
}

.page-head h1{
    margin:0 0 8px;
    font-size:30px;
}

.page-head p{
    margin:0;
    opacity:.9;
}

/* =========================
   TÌM KIẾM
========================= */

.search-box{
    background:#fff;
    margin-top:25px;
    padding:24px;
    border-radius:12px;
    border:1px solid #e1e7e4;
    box-shadow:0 4px 18px rgba(0,0,0,.04);
}

.search-grid{
    display:grid;
    grid-template-columns:1.2fr 1.2fr 1fr 1fr auto;
    gap:12px;
    align-items:end;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

.field input,
.field select{
    width:100%;
    height:48px;
    border:1px solid #d9e1dd;
    border-radius:8px;
    padding:0 12px;
    font-family:inherit;
    background:#fff;
}

.search-button{
    height:48px;
    padding:0 25px;
    background:#078c4b;
    color:white;
    border:0;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
}

/* =========================
   NỘI DUNG
========================= */

.content-layout{
    display:grid;
    grid-template-columns:240px 1fr;
    gap:22px;
    margin-top:24px;
    margin-bottom:50px;
}

.filter{
    background:#fff;
    border:1px solid #e2e7e5;
    border-radius:10px;
    padding:20px;
    height:max-content;
}

.filter h3{
    margin-top:0;
}

.filter-group{
    border-top:1px solid #eee;
    padding:17px 0;
}

.filter-group strong{
    display:block;
    margin-bottom:12px;
    font-size:14px;
}

.filter label{
    display:block;
    margin:9px 0;
    font-size:13px;
    color:#56635d;
}

.results-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
}

.results-head h2{
    margin:0;
    font-size:21px;
}

.results-head span{
    font-size:13px;
    color:#6d7772;
}

.order-card{
    background:#fff;
    border:1px solid #e1e6e4;
    border-radius:12px;
    padding:20px;
    margin-bottom:14px;
    display:flex;
    <div class="nav-buttons" id="navUserButtons">

    <button
        type="button"
        class="btn btn-outline"
        onclick="window.location.href='dang-nhap.html'">
        Đăng nhập
    </button>

    <button
        type="button"
        class="btn btn-green"
        onclick="window.location.href='dang-ky.html'">
        Đăng ký
    </button>
    
</div>

.order-route{
    font-size:18px;
    font-weight:800;
    margin-bottom:12px;
}

.order-info{
    color:#68736e;
    font-size:13px;
    line-height:1.9;
}

.order-price{
    min-width:180px;
    text-align:right;
}

.price{
    color:#078c4b;
    font-weight:800;
    font-size:19px;
    margin-bottom:15px;
}

.receive-btn{
    border:0;
    background:#078c4b;
    color:#fff;
    padding:11px 18px;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
}

.message-box{
    background:#fff;
    padding:25px;
    border-radius:12px;
    border:1px solid #e1e6e4;

/* =========================
   FOOTER
========================= */

.footer{
    background:#073c27;
    color:#fff;
    padding:30px 0;
    text-align:center;
}

.footer p{
    opacity:.8;
    font-size:13px;
}

/* =========================

========================= */

        display: none;
    }

        grid-template-columns: 1fr !important;
        width: 100% !important;
        max-width: 100% !important;
    }

    .content-layout {
        display: block !important;
        grid-template-columns: none !important;
        width: 100% !important;
        max-width: 100% !important;
    }

    .content-layout > * {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
    }

    .filter {
        display: block !important;
        width: 100% !important;
        max-width: 100% !important;

}

@media(max-width:600px){

body{

}

.container-page,

    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;
    box-sizing:border-box !important;
}

.search-grid{
    display:grid !important;
    grid-template-columns:1fr !important;
    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;
    gap:14px !important;
}

.search-grid > .field{
    display:block !important;
    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;
}

.search-grid input,
.search-grid select{
    display:block !important;
    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;
    height:50px !important;
    min-height:50px !important;
    padding:10px 12px !important;
    font-size:16px !important;
    line-height:1.2 !important;
    box-sizing:border-box !important;
    position:relative !important;
    z-index:20 !important;
    pointer-events:auto !important;
    touch-action:manipulation !important;
    opacity:1 !important;
    visibility:visible !important;
    color:#14231b !important;
    background:#fff !important;
    -webkit-text-fill-color:#14231b !important;
}

.search-grid input:focus{
    color:#14231b !important;
    -webkit-text-fill-color:#14231b !important;
}
    .search-nav{
        flex-wrap:wrap;
        padding-top:12px;
        padding-bottom:12px;
    }

    .search-grid{
    display:grid !important;
    grid-template-columns:minmax(0,1fr) !important;
    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;
    gap:14px !important;
}
    .search-grid > .field{
    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;
}

.search-grid .field input,
.search-grid .field select{
    display:block !important;
    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;
    box-sizing:border-box !important;
    height:48px !important;
    min-height:48px !important;
    font-size:16px !important;
    padding:10px 12px !important;
    pointer-events:auto !important;
    opacity:1 !important;
    visibility:visible !important;
    position:relative !important;
    z-index:5 !important;
}

    .nav-buttons{
        width:100%;
    }

    .nav-buttons a{
        flex:1;
    }

    .order-card{
        flex-direction:column;
    }

    .order-price{
        text-align:left;
    }
}
</style>
</head>

<script>
const supabaseClient = window.supabaseClient;


const navUserButtons =
document.getElementById("navUserButtons");

const orderContainer =
document.getElementById("orders");

const orderCount =
document.getElementById("orderCount");


/* ====================================
   CẬP NHẬT MENU ĐĂNG NHẬP
==================================== */

function updateUserMenu(session){

    if(!navUserButtons){
        return;
    }

    if(session){

    navUserButtons.innerHTML = `

        <button
            type="button"
            class="btn btn-outline"
            onclick="window.location.href='dashboard.html'">
            Dashboard
        </button>

        <button
            type="button"
            class="btn btn-green"
            onclick="window.location.href='tai-khoan.html'">
            Tài khoản
        </button>

    `;



    }else{

        navUserButtons.innerHTML = `

    <button
        type="button"
        class="btn btn-outline"
        onclick="window.location.href='dang-nhap.html'">
        Đăng nhập
    </button>

    <button
        type="button"
        class="btn btn-green"
        onclick="window.location.href='dang-ky.html'">
        Đăng ký
    </button>

`;
       
    }
}


/* ====================================
   KIỂM TRA ĐĂNG NHẬP
==================================== */

async function checkLogin(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();


        if(error){

            console.error(
                "Lỗi kiểm tra đăng nhập:",
                error
            );

            updateUserMenu(null);

            return;
        }


        updateUserMenu(
            data.session
        );


    }catch(error){

        console.error(error);

        updateUserMenu(null);

    }

}


/* ====================================
   THEO DÕI THAY ĐỔI ĐĂNG NHẬP
==================================== */

supabaseClient.auth.onAuthStateChange(
function(event,session){

    console.log(
        "Auth:",
        event
    );

    updateUserMenu(session);

});


/* ====================================
   CHỐNG CHÈN HTML
==================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* ====================================
   ĐỊNH DẠNG GIÁ
==================================== */

function formatPrice(value){

    const number =
    Number(value);

    if(
        !Number.isFinite(number) ||
        number <= 0
    ){

        return "Thỏa thuận";

    }

    return new Intl.NumberFormat(
        "vi-VN"
    ).format(number)
    + " đ";

}


/* ====================================
   ĐỊNH DẠNG NGÀY
==================================== */

function formatDate(value){

    if(!value){

        return "Chưa xác định";

    }

    const date =
    new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return escapeHTML(value);

    }

    return date.toLocaleDateString(
        "vi-VN"
    );

}


/* ====================================
   HIỂN THỊ ĐƠN HÀNG
==================================== */

function renderOrders(orders){

    orderContainer.innerHTML = "";

    orderCount.textContent =
        orders.length + " đơn hàng";

    if (!orders.length) {

        orderContainer.innerHTML = `
            <div class="message-box">
                <strong>Hiện chưa có đơn hàng.</strong>
                <br><br>
                Các đơn mới đăng sẽ xuất hiện tại đây.
            </div>
        `;

        return;
    }

    orders.forEach(function(order){

        const card = document.createElement("div");
        card.className = "order-card";

        const pickup = escapeHTML(
            order.pickup_location || "Chưa xác định"
        );

        const delivery = escapeHTML(
            order.delivery_location || "Chưa xác định"
        );

        const cargo = escapeHTML(
            order.cargo_type || "Hàng hóa"
        );

        const weight = escapeHTML(
            order.weight ?? "Chưa xác định"
        );

        const vehicle = escapeHTML(
            order.vehicle_type || "Không yêu cầu"
        );

        card.innerHTML = `
            <div>
                <div class="order-route">
                    ${pickup}
                    <span style="color:#078c4b">→</span>
                    ${delivery}
                </div>

                <div class="order-info">
                    📦 ${cargo}<br>
                    ⚖️ Trọng lượng: ${weight}<br>
                    🚚 Loại xe: ${vehicle}<br>
                    📅 Ngày lấy: ${formatDate(order.pickup_date)}
                </div>
            </div>

            <div class="order-price">

                <div class="price">
                    ${formatPrice(order.price)}
                </div>

                <button
                    type="button"
                    class="quote-btn"
                >
                    Báo giá
                </button>

                <button
                    type="button"
                    class="receive-btn"
                >
                    Nhận chuyến
                </button>

            </div>
        `;

        const quoteButton =
            card.querySelector(".quote-btn");

        const receiveButton =
            card.querySelector(".receive-btn");


        /* =========================
           BÁO GIÁ
        ========================= */

        quoteButton.addEventListener(
            "click",
            async function(){

                const priceInput = prompt(
                    "Nhập giá vận chuyển bạn muốn báo (VNĐ):"
                );

                if (priceInput === null) return;

                const price = Number(
                    priceInput.replace(/[^\d]/g, "")
                );

                if (!price || price <= 0) {
                    alert("Giá báo không hợp lệ.");
                    return;
                }

                const message =
                    prompt(
                        "Ghi chú cho chủ hàng (không bắt buộc):"
                    ) || null;

                quoteButton.disabled = true;
                quoteButton.textContent = "Đang gửi...";

                try {

                    const {
                        data: { session },
                        error: sessionError
                    } =
                    await supabaseClient.auth.getSession();

                    if (sessionError || !session) {

                        alert(
                            "Bạn cần đăng nhập để báo giá."
                        );

                        window.location.href =
                            "dang-nhap.html";

                        return;
                    }

                    if (
                        session.user.id ===
                        order.user_id
                    ) {

                        alert(
                            "Bạn không thể tự báo giá cho đơn hàng của mình."
                        );

                        quoteButton.disabled = false;
                        quoteButton.textContent = "Báo giá";

                        return;
                    }

                    const { error } =
                        await supabaseClient
                            .from("quotes")
                            .insert({
                                order_id: order.id,
                                user_id: session.user.id,
                                price: price,
                                message: message,
                                status: "pending"
                            });

                    if (error) {

                        console.error(
                            "Lỗi gửi báo giá:",
                            error
                        );

                        if (error.code === "23505") {
                            alert(
                                "Bạn đã gửi báo giá cho đơn hàng này rồi."
                            );
                        } else {
                            alert(
                                "Không thể gửi báo giá: " +
                                error.message
                            );
                        }

                        quoteButton.disabled = false;
                        quoteButton.textContent = "Báo giá";

                        return;
                    }

                    alert("Gửi báo giá thành công!");

                    quoteButton.textContent =
                        "Đã báo giá";

                } catch(error) {

                    console.error(error);

                    alert(
                        "Có lỗi khi gửi báo giá."
                    );

                    quoteButton.disabled = false;
                    quoteButton.textContent = "Báo giá";
                }
            }
        );


        /* =========================
           NHẬN CHUYẾN
        ========================= */

        receiveButton.addEventListener(
            "click",
            async function(){

                const ok = confirm(
                    "Bạn xác nhận nhận chuyến hàng này?"
                );

                if (!ok) return;

                receiveButton.disabled = true;
                receiveButton.textContent =
                    "Đang nhận chuyến...";

                try {

                    const { data, error } =
                        await supabaseClient.rpc(
                            "accept_order",
                            {
                                p_order_id: order.id
                            }
                        );

                    if (error) {

                        console.error(
                            "Lỗi nhận chuyến:",
                            error
                        );

                        alert(
                            "Không thể nhận chuyến: " +
                            error.message
                        );

                        receiveButton.disabled = false;
                        receiveButton.textContent =
                            "Nhận chuyến";

                        return;
                    }

                    if (data !== true) {

                        alert(
                            "Đơn hàng này đã được người khác nhận hoặc không còn khả dụng."
                        );

                        await loadOrders();

                        return;
                    }

                    alert(
                        "Nhận chuyến thành công!"
                    );

                    await loadOrders();

                } catch(error) {

                    console.error(error);

                    alert(
                        "Có lỗi xảy ra khi nhận chuyến."
                    );

                    receiveButton.disabled = false;
                    receiveButton.textContent =
                        "Nhận chuyến";
                }
            }
        );


        orderContainer.appendChild(card);

    });
}

/* ====================================
   TẢI ĐƠN HÀNG
==================================== */

async function loadOrders(){

  orderContainer.innerHTML = `
    <div class="message-box">
      Đang tải danh sách hàng...
    </div>
  `;

  
  try {

    const {
      data,
      error
    } = await supabaseClient
      .from("orders")
      .select("*")
      .order("created_at", {
        ascending: false
      });

    if (error) {
    console.error("Lỗi tải đơn hàng:", error);
    renderOrders([]);
    orderCount.textContent = "0 đơn hàng";
    return;
}

    if (data && data.length > 0) {
    renderOrders(data);
    orderCount.textContent = data.length + " đơn hàng";
} else {
    renderOrders([]);
    orderCount.textContent = "0 đơn hàng";
}
  } catch(error) {
    console.error("Không kết nối được Supabase:", error);
    renderOrders([]);
    orderCount.textContent = "0 đơn hàng";
}
}

/* ====================================
   NÚT TÌM HÀNG
==================================== */

document
.getElementById("searchButton")
.addEventListener(
"click",
loadOrders
);


/* ====================================
   KHỞI ĐỘNG
==================================== */

document.addEventListener(
"DOMContentLoaded",
async function(){

    await checkLogin();

    await loadOrders();

});

</script>
