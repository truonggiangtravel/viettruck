<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng xe | VietTruck</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7f6;
      color: #222;
    }

    .header {
      background: #078a45;
      color: #fff;
      padding: 18px 24px;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      color: #078a45;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .full {
      grid-column: 1 / -1;
    }

    button {
      margin-top: 20px;
      padding: 14px 22px;
      background: #078a45;
      color: #fff;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #066f39;
    }

    #message {
      margin-top: 15px;
      font-weight: 600;
    }

    @media(max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <strong>VietTruck</strong> - Đăng xe vận chuyển
  </div>

  <div class="container">
    <h1>Đăng xe</h1>

    <form id="vehicleForm">
      <div class="grid">

        <div class="field">
          <label>Biển số xe *</label>
          <input id="plate_number" required />
        </div>

        <div class="field">
          <label>Loại xe *</label>
          <select id="vehicle_type" required>
            <option value="">Chọn loại xe</option>
            <option value="Xe tải thùng">Xe tải thùng</option>
            <option value="Xe mui bạt">Xe mui bạt</option>
            <option value="Xe đông lạnh">Xe đông lạnh</option>
            <option value="Container">Container</option>
            <option value="Xe đầu kéo">Xe đầu kéo</option>
          </select>
        </div>

        <div class="field">
          <label>Tải trọng (tấn)</label>
          <input id="capacity" type="number" step="0.1" />
        </div>

        <div class="field">
          <label>Ngày sẵn sàng</label>
          <input id="available_date" type="date" />
        </div>

        <div class="field">
          <label>Tỉnh/Thành xe đang ở *</label>
          <input id="current_province" required />
        </div>

        <div class="field">
          <label>Quận/Huyện hiện tại</label>
          <input id="current_district" />
        </div>

        <div class="field">
          <label>Tỉnh/Thành muốn đi *</label>
          <input id="destination_province" required />
        </div>

        <div class="field">
          <label>Quận/Huyện điểm đến</label>
          <input id="destination_district" />
        </div>

        <div class="field">
          <label>Tên tài xế</label>
          <input id="driver_name" />
        </div>

        <div class="field">
          <label>Số điện thoại tài xế</label>
          <input id="driver_phone" />
        </div>

        <div class="field full">
          <label>Mô tả thêm</label>
          <textarea id="description"></textarea>
        </div>

      </div>

      <button type="submit">Đăng xe</button>

      <div id="message"></div>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "DAN_URL_SUPABASE_CUA_BAN";
    const SUPABASE_ANON_KEY = "DAN_ANON_KEY_CUA_BAN";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const form = document.getElementById("vehicleForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      message.textContent = "Đang lưu xe...";

      const {
        data: { user },
        error: userError
      } = await supabaseClient.auth.getUser();

      if (userError || !user) {
        message.textContent = "Bạn cần đăng nhập trước khi đăng xe.";
        return;
      }

      const vehicleData = {
        user_id: user.id,

        plate_number:
          document.getElementById("plate_number").value.trim(),

        vehicle_type:
          document.getElementById("vehicle_type").value,

        capacity:
          document.getElementById("capacity").value
            ? Number(document.getElementById("capacity").value)
            : null,

        current_location:
          document.getElementById("current_province").value.trim(),

        destination:
          document.getElementById("destination_province").value.trim(),

        available_date:
          document.getElementById("available_date").value || null,

        current_province:
          document.getElementById("current_province").value.trim(),

        current_district:
          document.getElementById("current_district").value.trim() || null,

        destination_province:
          document.getElementById("destination_province").value.trim(),

        destination_district:
          document.getElementById("destination_district").value.trim() || null,

        driver_name:
          document.getElementById("driver_name").value.trim() || null,

        driver_phone:
          document.getElementById("driver_phone").value.trim() || null,

        description:
          document.getElementById("description").value.trim() || null,

        status: "available"
      };

      const { data, error } = await supabaseClient
        .from("vehicles")
        .insert(vehicleData)
        .select()
        .single();

      if (error) {
        console.error(error);
        message.textContent = "Lỗi đăng xe: " + error.message;
        return;
      }

      message.textContent = "Đăng xe thành công.";

      form.reset();

      setTimeout(() => {
        window.location.href = "tim-xe.html";
      }, 1000);
    });
  </script>

</body>
</html>
